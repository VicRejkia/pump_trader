# --- 3. DECISION RULES (VETO-Focused) ---
key_decision_rules_section: |
  **Key Decision Rules & Interpretation Guide:**
  - **Data Source:** Interpret '{source}' data correctly ({source_explanation}).
  
  - **CRITICAL VETO SIGNALS (Read First):**
    - **Bad Creator:** A creator history with many rugged tokens is a **MAJOR VETO SIGNAL (DO NOT BUY)**.
    - **Dead Token (N/A):** If Market Dynamics are 'N/A' or volatility is 0.000, it means **ZERO activity**. This is a **MAJOR VETO SIGNAL (DO NOT BUY)**. For SELL/HOLD, this is a strong EXIT signal.

  - **Risk Scores (Lower is Better):**
      - **Rugcheck Score:** Scale: <50 (Low), <600 (Moderate), 900+ (Very High).
      - **Social Score (0-100):** Scale: <10 (Excellent), <30 (Good), <50 (Moderate), 70+ (Very Poor).
  
  - **Market Cap (USD):** {market_cap_guidance}
  - **Creator History:** A history of past 10x tokens is positive. A history of many rugs is a VETO.
  - **URI Status:** 'Missing', 'Invalid Format', or 'Error' is a potential VETO for buys.
  {context_specific_rules} # Placeholder for BUY/SELL/REBUY specific rules

  - **CRITICAL - Past Situations (RAG) Warning:**
    - Learn from relevant past scenarios provided below, but **PRIORITIZE CURRENT TOKEN DATA**.
    - You *must* consider why the current token is similar to or different from the past cases.
    
  --- Relevant Past Situations (Your Actions) ---
  {rag_context_actions}

  --- Relevant Market Examples (Other Tokens) ---
  {rag_context_market}
  
  **Overall Market Context:** The current Solana market regime is **{market_regime}**.
  - In 'BULLISH' regimes, you can be more tolerant of risk for high momentum.
  - In 'BEARISH' regimes, you must be extremely risk-averse and prioritize capital preservation.

# --- 4. NEW: JSON OUTPUT FORMAT INSTRUCTIONS (Simplified) ---
json_output_format: |
  **CRITICAL: YOUR TASK IS TO RETURN A VALID JSON OBJECT.**
  - Your *entire* response must be a single JSON object.
  - **DO NOT** include any text, titles, markdown (like `###`), or explanations before or after the JSON.
  - Perform a step-by-step analysis *internally* using the 7 steps below, then provide your final output in the specified JSON format.

  **Internal Reasoning Steps (Do not include these steps in the final output):**
  1.  **VETO Check**: Check for Critical Veto Signals (Bad Creator, Dead Token, Bad URI).
  2.  **Risk Analysis**: Evaluate creator, rug, and social scores.
  3.  **Momentum Analysis**: Evaluate market dynamics, RSI, and EMAs.
  4.  **Hype Analysis**: Evaluate Telegram stats.
  5.  **RAG Synthesis**: Compare to past cases and market examples.
  6.  **Data Quality**: Check completeness: {data_completeness_score}% - {data_completeness_notes}.
  7.  **Final Synthesis**: Weigh all factors to make a final decision.

  **REQUIRED JSON OUTPUT SCHEMA:**
  Make 100% sure your output matches this schema exactly:
  {{
    "decision": "string (Valid values: 'BUY', 'SELL', 'HOLD')",
    "confidence": "integer [0-100]",
    "full_reasoning": "string (A concise, one-paragraph summary of your final synthesis, justifying the decision and confidence based on your internal step-by-step analysis.)"
  }}