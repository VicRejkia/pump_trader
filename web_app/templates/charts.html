<div class="row">

            <div class="card-header">
                <i class="fas fa-chart-line"></i> Token Price Chart
            </div>
            <div class="card-body">
                <div class="form-group mb-3">
                    <label for="token-select"><strong>Select Token:</strong></label>
                    <select class="form-control" id="token-select">
                        <option value="">Loading tokens...</option>
                    </select>
                </div>
                <div id="tradingview-chart-container" style="height: 600px; width: 100%; border: 1px solid #eee;">
                    <div class="d-flex justify-content-center align-items-center h-100">

                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
