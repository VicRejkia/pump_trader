<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Token Price Analysis</title>
    <!-- Include Plotly.js from CDN -->
    <script src='https://cdn.plot.ly/plotly-latest.min.js'></script>
    <style>
        body {
            font-family: sans-serif;
            margin: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        textarea {
            width: 90%;
            min-height: 60px;
            margin-bottom: 10px;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            padding: 10px 15px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1em;
        }
        button:hover {
            background-color: #0056b3;
        }
        #chart-div {
            margin-top: 20px;
            width: 90%;
            height: 500px; /* Adjust height as needed */
        }
        #status-message {
            margin-top: 10px;
            color: #555;
        }
    </style>
</head>
<body>
    <h1>Token Price Analysis</h1>

    <div id="filters" style="margin-bottom: 15px; padding: 10px; border: 1px solid #eee; border-radius: 5px; width: 90%;">
        <h3>Filters</h3>
        <div style="display: flex; flex-wrap: wrap; gap: 15px;">
            <div>
                <label for="filter-max-socials">Max Socials Score (0-100):</label><br>
                <input type="number" id="filter-max-socials" value="100" min="0" max="100" style="width: 80px;">
            </div>
            <div>
                <label for="filter-max-rugcheck">Max Rugcheck Score (0-10000):</label><br>
                <input type="number" id="filter-max-rugcheck" value="10000" min="0" max="10000" style="width: 100px;">
            </div>
            <div>
                <label for="filter-min-volume">Min Volume (SOL):</label><br>
                <input type="number" id="filter-min-volume" value="0" min="0" step="0.01" style="width: 80px;">
            </div>
            <div>
                <label for="filter-time-window">Volume Time Window:</label><br>
                <select id="filter-time-window" style="padding: 2px;">
                    <option value="60" selected>Last 1 Hour</option>
                    <option value="360">Last 6 Hours</option>
                    <option value="1440">Last 24 Hours</option>
                    <option value="10080">Last 7 Days</option>
                </select>
            </div>
            <div style="align-self: center;"> <!-- Align checkbox vertically -->
                <input type="checkbox" id="filter-portfolio-only" style="margin-right: 5px;">
                <label for="filter-portfolio-only" style="display: inline;">Portfolio Only</label>
            </div>
        </div>
        <button id="apply-filters-btn" style="margin-top: 10px; padding: 5px 10px;">Apply Filters</button>
    </div>

    <label for="mints-select">Select Tokens (Ctrl/Cmd + Click for multiple):</label>
    <select id="mints-select" multiple size="10" style="width: 90%; margin-bottom: 10px; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
        <!-- Options will be populated by JavaScript -->
        <option value="" disabled>Apply filters to load tokens...</option>
    </select>

    <button id="generate-chart-btn" style="margin-top: 5px;">Generate Chart</button>

    <div id="status-message"></div>
    <div id="chart-div"></div>

    <!-- Include custom JavaScript file -->
    <script src="{{ url_for('static', filename='js/chart.js') }}"></script>
</body>
</html>
