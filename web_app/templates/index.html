<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Token Price Analysis</title>
    <!-- Include Plotly.js from CDN -->
    <script src='https://cdn.plot.ly/plotly-latest.min.js'></script>
    <style>
        body {
            font-family: sans-serif;
            margin: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        textarea {
            width: 90%;
            min-height: 60px;
            margin-bottom: 10px;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            padding: 10px 15px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1em;
        }
        button:hover {
            background-color: #0056b3;
        }
        #chart-div {
            margin-top: 20px;
            width: 90%;
            height: 500px; /* Adjust height as needed */
        }
        #status-message {
            margin-top: 10px;
            color: #555;
        }
    </style>
</head>
<body>
    <h1>Token Price Analysis</h1>

    <label for="mints-select">Select Tokens (Ctrl/Cmd + Click for multiple):</label>
    <select id="mints-select" multiple size="10" style="width: 90%; margin-bottom: 10px; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
        {% if tokens_list %}
            {% for token in tokens_list %}
                {# Display name and mint address. Use mint as value. #}
                <option value="{{ token.mint }}">{{ token.name }} - {{ token.symbol }} - {{ token.socials_score }}/{{ token.rugcheck_score }} - ({{ token.mint }})</option>
            {% endfor %}
        {% else %}
            <option value="" disabled>Could not load tokens from database.</option>
        {% endif %}
    </select>

    <button id="generate-chart-btn">Generate Chart</button>

    <div id="status-message"></div>
    <div id="chart-div"></div>

    <!-- Include custom JavaScript file -->
    <script src="{{ url_for('static', filename='js/chart.js') }}"></script>
</body>
</html>
