# Prompts - BUY/REBUY Context Configuration

# Decision options relevant to this context
decision_options: "BUY or HOLD" # HOLD means 'do not buy yet'

# Specific guidance text to insert into the main prompt
context_specific_guidance: |
  - Focus on ENTRY signals, risk assessment, momentum, and potential upside.
  - If Context is INITIAL BUY: Is this a good *first* entry point? Assess initial risk vs. reward.
  - If Context is REBUY: Analyze the *reason* for the previous exit (from trade history). Has the situation improved significantly? Is there confirmed trend reversal if the exit was due to stop loss? Re-entry needs stronger signals than initial buy.
  - Is this a good time to enter/re-enter based on current data and trends?

# Explanation of data sources
source_explanation: "PUMP = High-frequency individual trades, DEXSCREENER = Periodic aggregate snapshots"

# Guidance regarding market cap for buys
market_cap_guidance: "Avoid buys below ${default_marketcap_threshold:,.0f} unless other signals (momentum, risk scores) are exceptionally strong. Very low MC indicates high risk."

# Specific rules for the BUY/REBUY context
context_specific_rules: |
  - Look for positive momentum (Price Change, Volume Velocity/Trend), improving risk scores (decreasing Rugcheck/Social), and reasonable volatility (not too low, not excessively high).
  - Consider Token Age: Very young tokens need caution. Older tokens need clear signs of renewed interest.
  - Creator/URI Status: 'Prolific/Suspicious' creator or 'Error'/'Missing' URI increases entry risk significantly. Require stronger positive signals to compensate.

# Template for formatting PUMP market dynamics data
market_dynamics_template_pump: |
  - Price Change (1min): {pump_price_change_1m}
  - Volume Velocity (1min): {pump_volume_velocity_1m}
  - Tick Frequency (1min): {pump_tick_frequency_1m} trades/min

# Template for formatting DEXSCREENER market dynamics data
market_dynamics_template_dex: |
  - Price Change (5min snap): {dex_price_change_m5:.2f}%
  - Volume (5min snap): ${dex_volume_m5:,.0f}
  - Buys/Sells (5min snap): {dex_buys_m5} / {dex_sells_m5} (Higher Buy ratio is positive)
  - Price Trend (15min): {dex_price_trend_15m} (Compare recent snapshots)
  - Volume Trend (15min): {dex_volume_trend_15m} (Compare recent snapshots)
  - Liquidity Trend (30min): {dex_liquidity_trend_30m} (Compare recent snapshots - Increasing is generally good for stability)